    <script>
        const API_BASE_ENDPOINT = '/api';
        
        // =========================================================================
        // 💾 UNIFIED SYSTEM STATE POINTERS (NO DUPLICATIONS)
        // =========================================================================
        let liveInventoryState = [];
        let liveOrdersState = [];
        let completedHistoryState = [];
        let temporaryImageBase64 = "";
        let liveMarqueeOfferMessageStr = "";

        // LOCAL DEVICE STORAGE CONTROLLER - OPEN MEDIA DATABASE ENGINE
        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("IndianTelecomMediaDB", 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("product_images")) {
                        db.createObjectStore("product_images", { keyPath: "id" });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveImageLocally(id, base64Data) {
            try {
                const db = await openIndexedDB();
                const transaction = db.transaction("product_images", "readwrite");
                const store = transaction.objectStore("product_images");
                store.put({ id: id, data: base64Data });
            } catch (err) { console.error("IndexedDB Save Fault:", err); }
        }

        async function getImageLocally(id) {
            try {
                const db = await openIndexedDB();
                return new Promise((resolve) => {
                    const transaction = db.transaction("product_images", "readonly");
                    const store = transaction.objectStore("product_images");
                    const request = store.get(id);
                    request.onsuccess = (e) => resolve(e.target.result ? e.target.result.data : null);
                    request.onerror = () => resolve(null);
                });
            } catch (err) { return null; }
        }
        // =========================================================================
        // 📥 CLOUD SYNC INITIALIZATION PIPELINE
        // =========================================================================
        async function pullMasterDatabaseArrays() {
            try {
                const cacheBusterToken = Date.now();

                // 📢 LIVE BANNER DOWNLOAD LAYER
                const bannerMsgResponse = await fetch(`${API_BASE_ENDPOINT}/admin?type=banner_msg&_t=${cacheBusterToken}`);
                if (bannerMsgResponse.ok) {
                    const parsedBannerPayload = await bannerMsgResponse.json();
                    liveMarqueeOfferMessageStr = parsedBannerPayload.message || "MEGA OFFER: FLAT 30% OFF ON PREMIUM CHARGERS & COVERS!";
                    const msgInputFieldElement = document.getElementById("live-banner-message-field");
                    if (msgInputFieldElement) msgInputFieldElement.value = liveMarqueeOfferMessageStr;
                }

                // 1. Fetch live product catalog structures
                const productResponse = await fetch(`${API_BASE_ENDPOINT}/admin?type=products&_t=${cacheBusterToken}`);
                if (productResponse.ok) { liveInventoryState = await productResponse.json(); }

                // 2. Fetch active checkout order records queue
                const orderResponse = await fetch(`${API_BASE_ENDPOINT}/admin?type=orders&_t=${cacheBusterToken}`);
                if (orderResponse.ok) { liveOrdersState = await orderResponse.json(); }
                // 3. Fetch completed shipped logs array safely into global tracker
                const historyResponse = await fetch(`${API_BASE_ENDPOINT}/admin?type=history&_t=${cacheBusterToken}`);
                if (historyResponse.ok) { 
                    const historicalServerPayload = await historyResponse.json();
                    completedHistoryState = Array.isArray(historicalServerPayload) ? historicalServerPayload : [];
                }

                // 4. Fetch registered client credentials accounts safely
                const usersResponse = await fetch(`${API_BASE_ENDPOINT}/admin?type=users&_t=${cacheBusterToken}`);
                const userTableBody = document.getElementById("users-list-target");
                
                if (usersResponse.ok && userTableBody) {
                    const databaseUsersList = await usersResponse.json();
                    userTableBody.innerHTML = ""; 
                    
                    if (!databaseUsersList || databaseUsersList.length === 0) {
                        userTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:30px; font-weight:700;">No data records found inside cloud store.</td></tr>`;
                    } else {
                        const activeClients = databaseUsersList.filter(u => !u.status || u.status !== 'SUSPENDED');
                        const suspendedClients = databaseUsersList.filter(u => u.status === 'SUSPENDED');

                        userTableBody.innerHTML = activeClients.length === 0 ? 
                            `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:30px;">No active customer profiles found.</td></tr>` :
                            activeClients.map((u) => {
                                const masterIdx = databaseUsersList.findIndex(masterUser => masterUser.id === u.id);
                                return `
                                    <tr>
                                        <td style="font-weight:700; color:#3b82f6; padding:12px 8px;">#${u.id || 'U'}</td>
                                        <td style="color:#ffffff; font-weight:bold; padding:12px 8px;">${u.name || 'N/A'}</td>
                                        <td style="color:#cbd5e1; padding:12px 8px;">${u.phone || u.contact || 'N/A'}</td>
                                        <td style="font-family:monospace; color:#a1a1aa; padding:12px 8px;">${u.password || 'N/A'}</td>
                                        <td style="text-align: right; padding:12px 8px; white-space: nowrap;">
                                            <button class="action-icon-btn" style="color: #f59e0b; background: rgba(245,158,11,0.1); margin-right: 5px; font-weight: bold;" onclick="triggerInlineUserEdit(${masterIdx})">📝 Edit</button>
                                            <button class="action-icon-btn" style="color: #ef4444; background: rgba(239,68,68,0.1); font-weight: bold;" onclick="suspendCustomerAccount(${masterIdx})">🚫 Suspend</button>
                                        </td>
                                    </tr>
                                `;
                            }).join('');

                        const suspendedTableBody = document.getElementById("suspended-users-list-target");
                        if (suspendedTableBody) {
                            suspendedTableBody.innerHTML = suspendedClients.length === 0 ?
                                `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">No permanently suspended account histories logged.</td></tr>` :
                                suspendedClients.map((u) => {
                                    const masterIdx = databaseUsersList.findIndex(masterUser => masterUser.id === u.id);
                                    return `
                                        <tr style="background: rgba(239,68,68,0.02);">
                                            <td style="font-weight:700; color:#64748b; padding:12px 8px;">#${u.id || 'U'}</td>
                                            <td style="color:#94a3b8; text-decoration: line-through; padding:12px 8px;">${u.name || 'N/A'}</td>
                                            <td style="color:#64748b; padding:12px 8px;">${u.phone || u.contact || 'N/A'}</td>
                                            <td style="font-family:monospace; color:#4b5563; padding:12px 8px;">${u.password || 'N/A'}</td>
                                            <td style="text-align: right; padding:12px 8px; white-space: nowrap;">
                                                <button class="action-icon-btn" style="color: #10b981; background: rgba(16,185,129,0.1); font-weight: bold;" onclick="reactivateCustomerAccount(${masterIdx})">🔄 Reactivate</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('');
                        }
                    }
                }

                await renderAdminInventory();
                renderAdminOrders();
                renderAdminHistoryLog();
            } catch (err) { console.error("Master Sync Error:", err); }
        }
        // =========================================================================
        // 💻 RENDER PIPELINES FOR DATA TABLES
        // =========================================================================
        async function renderAdminInventory() {
            const targetTableBody = document.getElementById("inventory-list-target");
            if (!targetTableBody) return;
            
            if (liveInventoryState.length === 0) {
                targetTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:30px;">No items inside database inventory.</td></tr>`;
                return;
            }

            let compiledRows = "";
            for (let i = 0; i < liveInventoryState.length; i++) {
                const item = liveInventoryState[i];
                const cloudAssetImage = item.asset || await getImageLocally(item.id);
                
                compiledRows += `
                    <tr>
                        <td>
                            <div class="row-item-meta">
                                <div class="row-thumb">
                                    ${cloudAssetImage ? `<img src="${cloudAssetImage}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : '📱'}
                                </div>
                                <div style="font-weight: 700; color:#ffffff;">${item.name}</div>
                            </div>
                        </td>
                        <td style="color:#cbd5e1;">${item.category}</td>
                        <td style="color:#ffffff;"><strong>₹${item.discountPrice}</strong> <span style="font-size:12px; color:#64748b; text-decoration:line-through; margin-left:5px;">₹${item.price}</span></td>
                        <td>
                            <label class="toggle-switch">
                                <input type="checkbox" ${item.isLive ? 'checked' : ''} onchange="toggleProductVisibility(${i})">
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td>
                            <button class="action-icon-btn" style="color: #3b82f6; background: rgba(59,130,246,0.1); margin-right: 5px; font-weight: bold;" onclick="loadProductIntoEditorForm(${i})">📝 Edit</button>
                            <button class="action-icon-btn" onclick="deleteInventoryItem(${i})">🗑️ Remove</button>
                        </td>
                    </tr>
                `;
            }
            targetTableBody.innerHTML = compiledRows;
        }
        function renderAdminOrders() {
            const targetTableBody = document.getElementById("orders-log-target");
            if (!targetTableBody) return;
            
            if (liveOrdersState.length === 0) {
                targetTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">No active orders in queue!</td></tr>`;
                return;
            }
            
            targetTableBody.innerHTML = liveOrdersState.map((order, index) => `
                <tr>
                    <td style="font-weight: 700; color: #3b82f6;">#${order.id || 'ORD'}</td>
                    <td>
                        <div style="font-weight: 700; color:#ffffff;">${order.name}</div>
                        <div style="font-size: 12px; color: #94a3b8;">${order.phone || order.contact || 'N/A'}</div>
                    </td>
                    <td style="max-width: 220px; font-size: 13px; color: #cbd5e1;">${order.address || order.location || 'N/A'}</td>
                    <td><span class="badge ${order.mop === 'ONLINE' ? 'badge-success' : 'badge-warning'}">${order.mop}</span></td>
                    <td style="font-family: monospace; font-weight: 700; color: #f59e0b; letter-spacing: 0.5px;">${order.utr || 'N/A'}</td>
                    <td><button class="action-icon-btn ship-btn" onclick="fulfillOrder(${index})">✅ Ship</button></td>
                </tr>
            `).join('');
        }

        function renderAdminHistoryLog() {
            const targetTableBody = document.getElementById("history-log-target");
            if (!targetTableBody) return;
            
            if (!completedHistoryState || completedHistoryState.length === 0) {
                targetTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b; padding:30px;">No historical shipped logs captured yet.</td></tr>`;
                return;
            }
            
            targetTableBody.innerHTML = completedHistoryState.map(order => `
                <tr style="border-bottom: 1px solid #334155;">
                    <td style="font-weight: 700; color: #94a3b8; padding: 12px 8px;">#${order.id || 'ORD'}</td>
                    <td style="padding: 12px 8px;">
                        <div style="font-weight: 700; color:#cbd5e1;">${order.name || 'N/A'}</div>
                        <div style="font-size: 12px; color: #64748b;">${order.contact || order.phone || 'N/A'}</div>
                    </td>
                    <td style="max-width: 220px; font-size: 13px; color: #cbd5e1; padding: 12px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${order.location || order.address || 'N/A'}</td>
                    <td style="padding: 12px 8px;"><span class="badge" style="background: rgba(100,116,139,0.1); color:#cbd5e1; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${order.mop || 'N/A'}</span></td>
                    <td style="font-family: monospace; color: #f59e0b; padding: 12px 8px; font-weight: bold;">${order.utr || 'N/A'}</td>
                    <td style="padding: 12px 8px;"><span class="badge" style="background: rgba(16,185,129,0.1); color: #10b981; font-weight: bold; border: 1px solid rgba(16,185,129,0.2); padding: 4px 8px; border-radius: 4px; font-size: 12px;">📦 SHIPPED</span></td>
                </tr>
            `).join('');
        }
        // =========================================================================
        // 🔄 MUTATION CONTROLLERS AND ACTION ENGINES
        // =========================================================================
        async function fulfillOrder(index) {
            if (!confirm("Are you sure you want to mark this package as shipped?")) return;
            
            const shippedOrderInfo = liveOrdersState[index];
            if (!shippedOrderInfo) return alert("Order reference lost!");
            
            const trueCustomerPhone = shippedOrderInfo.phone || shippedOrderInfo.contact || "";
            const trueCustomerAddress = shippedOrderInfo.address || shippedOrderInfo.location || "N/A";
            
            const cleanArchivePayload = {
                id: shippedOrderInfo.id || 'ORD',
                name: shippedOrderInfo.name || 'N/A',
                contact: String(trueCustomerPhone).trim(),
                location: String(trueCustomerAddress).trim(),
                mop: shippedOrderInfo.mop || 'N/A',
                utr: shippedOrderInfo.utr || 'N/A'
            };
            
            completedHistoryState.push(cleanArchivePayload);
            liveOrdersState.splice(index, 1);
            
            try {
                await fetch(`${API_BASE_ENDPOINT}/admin?type=orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(liveOrdersState)
                });
                
                await fetch(`${API_BASE_ENDPOINT}/admin?type=history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(completedHistoryState)
                });
                
                alert(`SUCCESS: Order #${shippedOrderInfo.id} archived into historical registries!`);
                renderAdminOrders();
                renderAdminHistoryLog();
            } catch (e) { console.error("Shipping Fault:", e); }
        }

        async function pushNewMarqueeOfferMessage() {
            const inputFieldVal = document.getElementById("live-banner-message-field").value.trim();
            if (!inputFieldVal) return alert("Announcement validation strings cannot be empty.");
            
            try {
                const savePayload = { message: inputFieldVal };
                await fetch(`${API_BASE_ENDPOINT}/admin?type=banner_msg`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(savePayload)
                });
                alert("SUCCESS: Your storefront announcement headline has been updated live!");
                pullMasterDatabaseArrays();
            } catch (err) { alert("Banner Sync Error: " + err.message); }
        }
        async function triggerInlineUserEdit(masterIndex) {
            try {
                const response = await fetch(`${API_BASE_ENDPOINT}/admin?type=users&_t=${Date.now()}`);
                let currentUsersList = await response.json();
                const client = currentUsersList[masterIndex];
                
                const targetName = prompt("Modify Customer Full Name:", client.name);
                if (targetName === null) return;
                const targetPhone = prompt("Modify Verified 10-Digit Mobile Number:", client.phone || client.contact);
                if (targetPhone === null) return;
                const targetPass = prompt("Modify Security Password Key Reference:", client.password);
                if (targetPass === null) return;

                client.name = targetName.trim();
                client.phone = targetPhone.trim();
                client.contact = targetPhone.trim();
                client.password = targetPass.trim();

                await fetch(`${API_BASE_ENDPOINT}/admin?type=users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentUsersList)
                });
                alert("SUCCESS: Profile metrics updated!");
                pullMasterDatabaseArrays();
            } catch (err) { alert("User Edit Error: " + err.message); }
        }

        async function suspendCustomerAccount(masterIndex) {
            if (!confirm("Are you sure you want to suspend this user?")) return;
            try {
                const response = await fetch(`${API_BASE_ENDPOINT}/admin?type=users&_t=${Date.now()}`);
                let currentUsersList = await response.json();
                currentUsersList[masterIndex].status = 'SUSPENDED';

                await fetch(`${API_BASE_ENDPOINT}/admin?type=users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentUsersList)
                });
                alert("Customer Suspended successfully.");
                pullMasterDatabaseArrays();
            } catch (err) { alert("Suspension Error: " + err.message); }
        }

        async function reactivateCustomerAccount(masterIndex) {
            if (!confirm("Restore active storefront access parameters for this user?")) return;
            try {
                const response = await fetch(`${API_BASE_ENDPOINT}/admin?type=users&_t=${Date.now()}`);
                let currentUsersList = await response.json();
                currentUsersList[masterIndex].status = 'ACTIVE';

                await fetch(`${API_BASE_ENDPOINT}/admin?type=users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentUsersList)
                });
                alert("Customer account revived cleanly.");
                pullMasterDatabaseArrays();
            } catch (err) { alert("Reactivation Error: " + err.message); }
        }

        async function developerResetHistoryBucket() {
            if (!confirm("Completely wipe history records from the cloud repository to fix data streams?")) return;
            try {
                await fetch(`${API_BASE_ENDPOINT}/admin?type=history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([])
                });
                alert("Repository cleared fresh!");
                completedHistoryState = [];
                renderAdminHistoryLog();
            } catch (err) { alert("Reset Error: " + err.message); }
        }
        // =========================================================================
        // 📦 PRODUCT INVENTORY DATA HANDLING & INTERACTION ENGINE
        // =========================================================================
        function generateImagePreview(inputElement) {
            const preview = document.getElementById("upload-preview");
            if (inputElement.files && inputElement.files[0]) {
                const fileReaderEngine = new FileReader();
                fileReaderEngine.onload = function (e) {
                    temporaryImageBase64 = e.target.result;
                    if (preview) {
                        preview.src = temporaryImageBase64;
                        preview.style.display = "block";
                    }
                };
                fileReaderEngine.readAsDataURL(inputElement.files[0]);
            }
        }

        async function handleProductSubmission(event) {
            event.preventDefault();
            
            const name = document.getElementById("prod-name").value.trim();
            const category = document.getElementById("prod-cat").value;
            const price = parseFloat(document.getElementById("prod-price").value);
            const discountPrice = parseFloat(document.getElementById("prod-discount-price").value);

            if (!name || isNaN(price) || isNaN(discountPrice)) {
                alert("Please fill in all mandatory product data values accurately.");
                return;
            }
            try {
                if (activeEditingProductIndex !== null) {
                    // Update existing accessory index values inline
                    const targetProduct = liveInventoryState[activeEditingProductIndex];
                    targetProduct.name = name;
                    targetProduct.category = category;
                    targetProduct.price = price;
                    targetProduct.discountPrice = discountPrice;
                    
                    if (temporaryImageBase64) {
                        targetProduct.asset = temporaryImageBase64;
                        await saveImageLocally(targetProduct.id, temporaryImageBase64);
                    }
                    
                    alert(`SUCCESS: Item "${name}" modifications updated locally!`);
                    activeEditingProductIndex = null;
                    const submitBtnText = document.getElementById("submit-btn-text");
                    if (submitBtnText) submitBtnText.innerText = "Deploy Fresh Premium Accessory";
                } else {
                    // Generate fresh array object footprint structures
                    const uniqueAssetId = "PROD_" + Date.now();
                    const freshItemPayload = {
                        id: uniqueAssetId,
                        name: name,
                        category: category,
                        price: price,
                        discountPrice: discountPrice,
                        isLive: true,
                        asset: temporaryImageBase64 || ""
                    };
                    
                    if (temporaryImageBase64) {
                        await saveImageLocally(uniqueAssetId, temporaryImageBase64);
                    }
                    
                    liveInventoryState.push(freshItemPayload);
                    alert(`SUCCESS: Accessory "${name}" deployed into active repository grid queues!`);
                }

                // Push unified catalog modifications safely up to the cloud storage nodes
                await pushInventoryStateToCloud();
                document.getElementById("product-upload-form").reset();
                
                const previewImg = document.getElementById("upload-preview");
                if (previewImg) previewImg.style.display = "none";
                temporaryImageBase64 = "";

                pullMasterDatabaseArrays();
            } catch (err) {
                console.error("Accessory Deployment Crash:", err);
            }
        }
        function loadProductIntoEditorForm(index) {
            const item = liveInventoryState[index];
            if (!item) return;

            activeEditingProductIndex = index;
            
            // Map array indices smoothly into form input values
            document.getElementById("prod-name").value = item.name || "";
            document.getElementById("prod-cat").value = item.category || "Cases";
            document.getElementById("prod-price").value = item.price || "";
            document.getElementById("prod-discount-price").value = item.discountPrice || "";

            const previewImg = document.getElementById("upload-preview");
            const activeImage = item.asset;
            
            if (activeImage && previewImg) {
                previewImg.src = activeImage;
                previewImg.style.display = "block";
                temporaryImageBase64 = activeImage;
            } else if (previewImg) {
                previewImg.style.display = "none";
                temporaryImageBase64 = "";
            }

            const submitBtnText = document.getElementById("submit-btn-text");
            if (submitBtnText) submitBtnText.innerText = "💾 Save Accessory Changes";
            
            // Scroll form smoothly into active viewport view
            document.getElementById("product-upload-form").scrollIntoView({ behavior: 'smooth' });
        }

        async function toggleProductVisibility(index) {
            const item = liveInventoryState[index];
            if (!item) return;

            // Flip active boolean flag values
            item.isLive = !item.isLive;
            
            try {
                await pushInventoryStateToCloud();
                pullMasterDatabaseArrays();
            } catch (err) {
                console.error("Visibility Toggle Sync Fault:", err);
            }
        }
        async function deleteInventoryItem(index) {
            const item = liveInventoryState[index];
            if (!item) return;

            if (!confirm(`Are you absolutely sure you want to permanently delete "${item.name}" from your store catalog? This action cannot be undone.`)) return;

            // Remove the item from your runtime state storage array cleanly
            liveInventoryState.splice(index, 1);

            try {
                await pushInventoryStateToCloud();
                alert("Accessory deleted successfully from cloud store rows!");
                pullMasterDatabaseArrays();
            } catch (err) {
                console.error("Catalog deletion processing fault:", err);
            }
        }

        async function pushInventoryStateToCloud() {
            try {
                const fullInventoryWithImages = liveInventoryState.map(item => ({
                    id: item.id, 
                    name: item.name, 
                    category: item.category, 
                    price: item.price, 
                    discountPrice: item.discountPrice, 
                    isLive: item.isLive,
                    asset: item.asset
                }));
                
                await fetch(`${API_BASE_ENDPOINT}/admin?type=products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fullInventoryWithImages)
                });
            } catch (err) { console.error("Cloud data writing exception:", err); }
        }
        // =========================================================================
        // 🏁 ADMINISTRATIVE WORKSPACE INITIALIZATION BOOTSTRAPPER
        // =========================================================================
        window.onload = () => {
            // Trigger automatic cloud downloads right on page layout mount
            pullMasterDatabaseArrays();
        };
    </script>
</body>
</html>
